[package]
name = "gitflow"
version = "1.0.0-beta.3"
edition = "2024"
authors = ["Kairat Kubanychbek uulu <https://github.com/ImKairat>"]
description = "Gitflow is a Git extension that implements the Gitflow AVH branching model."
repository = "https://github.com/ImKairat-Rust-Lab/gitflow"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "color", "suggestions"] }
clap_complete = "4.6.3"
thiserror = "2.0.18"
anyhow = "1.0.102"
dialoguer = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.2", features = ["preserve_order"] }
directories = "6.0.0"
which = "8.0.2"
semver = "1.0.28"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"
